<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOOV - 로그인</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Pretendard', 'SUIT', 'Noto Sans KR', sans-serif;
        background: linear-gradient(135deg, #fff6fb, #f4ecff, #ffeef8);
        color: #222;
        min-height: 100vh;
      }

      header {
        width: 100%;
        padding: 28px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #111;
      }

      .logo span {
        color: #b79cff;
      }

      nav a {
        text-decoration: none;
        color: #555;
        margin-left: 24px;
        font-size: 15px;
        font-weight: 600;
      }

      nav a:hover {
        color: #d978ad;
      }

      .main {
        width: 86%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 0 80px;
      }

      .title-section {
        text-align: center;
        margin-bottom: 45px;
      }

      .sub-title {
        display: inline-block;
        background-color: rgba(255, 255, 255, 0.75);
        color: #9c78dd;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 20px;
        box-shadow: 0 8px 20px rgba(180, 140, 255, 0.18);
      }

      .title-section h1 {
        font-size: 56px;
        margin-bottom: 18px;
        line-height: 1.2;
      }

      .title-section h1 span {
        background: linear-gradient(90deg, #e58abb, #a98cff);
        -webkit-background-clip: text;
        color: transparent;
      }

      .title-section p {
        color: #666;
        font-size: 18px;
        line-height: 1.7;
      }

      .login-section {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        width: 100%;
        max-width: 430px;
        background-color: rgba(255, 255, 255, 0.88);
        border-radius: 32px;
        padding: 42px;
        box-shadow: 0 18px 45px rgba(190, 150, 230, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.9);
      }

      .login-container h2 {
        font-size: 30px;
        text-align: center;
        margin-bottom: 10px;
        color: #222;
      }

      .login-desc {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 34px;
        line-height: 1.6;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;
        margin-bottom: 9px;
        color: #666;
        font-size: 14px;
        font-weight: 700;
      }

      .input-group input {
        width: 100%;
        padding: 15px 17px;
        border: 1px solid #eadff5;
        border-radius: 16px;
        background-color: #fffafd;
        color: #222;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
      }

      .input-group input::placeholder {
        color: #aaa;
      }

      .input-group input:focus {
        border-color: #c9a7ff;
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(201, 167, 255, 0.16);
      }

      .login-btn {
        width: 100%;
        padding: 16px;
        margin-top: 8px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(90deg, #e889b8, #a98cff);
        color: white;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 25px rgba(210, 130, 190, 0.28);
        transition: 0.25s;
      }

      .login-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 35px rgba(210, 130, 190, 0.35);
      }

      .login-bottom {
        text-align: center;
        margin-top: 24px;
        font-size: 13px;
        color: #888;
      }

      .login-bottom a {
        color: #9c65cf;
        text-decoration: none;
        font-weight: 700;
      }

      .login-bottom a:hover {
        color: #d978ad;
      }

      footer {
        text-align: center;
        color: #999;
        font-size: 14px;
        padding: 30px;
      }

      @media screen and (max-width: 768px) {
        header {
          flex-direction: column;
          gap: 18px;
        }

        nav a {
          margin: 0 8px;
          font-size: 13px;
        }

        .title-section h1 {
          font-size: 38px;
        }

        .title-section p {
          font-size: 15px;
        }

        .main {
          width: 90%;
          padding-top: 25px;
        }

        .login-container {
          padding: 32px 24px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo">MO<span>O</span>V</div>

      <nav>
        <a href="#">로그인</a>
        <a href="#">장르별 추천</a>
        <a href="#">상황별 추천</a>
        <a href="#">인기곡</a>
        <a href="#">가수 추천</a>
      </nav>
    </header>

    <main class="main">
      <section class="title-section">
        <div class="sub-title">WELCOME TO MOOV</div>
        <h1>나의 취향에 맞는<br /><span>음악을 찾아보세요</span></h1>
        <p>
          MOOV는 사용자의 취향, 상황, 감정에 맞는 음악을 추천하는 서비스입니다.<br />
          로그인 후 더 다양한 음악 추천을 만나볼 수 있습니다.
        </p>
      </section>

      <section class="login-section">
        <div class="login-container">
          <h2>로그인</h2>
          <p class="login-desc">
            아이디와 비밀번호를 입력하고<br />
            MOOV의 음악 추천 서비스를 시작하세요.
          </p>

          <div class="input-group">
            <label for="username">아이디</label>
            <input type="text" id="username" placeholder="아이디를 입력하세요" />
          </div>

          <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요" />
          </div>

          <button class="login-btn" onclick="loginMessage()"><a href="jungma.html">로그인</a></button>

          <div class="login-bottom">아직 계정이 없나요? <a href="#">회원가입</a></div>
        </div>
      </section>
    </main>

    <footer>MOOV · MUSIC FOR YOUR MOOD</footer>

    <script>
      function loginMessage() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (username === '' || password === '') {
          alert('아이디와 비밀번호를 모두 입력해주세요.');
        } else {
          alert('성공적으로 로그인되었습니다!');
        }
      }
    </script>
  </body>
</html>
